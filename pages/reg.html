<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>注册/登录</title>
	</head>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		#div1{
			background-color: gold;
			width: 100%;
			height: 50px;
			line-height: 45px;
		}
		a{
			padding: 0 20px;
			text-decoration: none;
			font-size: 18px;
			color: gray;
		}
		a:hover{
			color: azure;
		}
		table{
			margin: 30px auto;
			line-height: 35px;
		}
		.button{
			background-color: gold;
			width: 10%;
			height: 50px;
			border: none;
			color: black;
			margin: auto;
			display: block;
		}
	</style>
	<body>
		<div id="div1">
			<a href="init.html" >首页</a>
			<a href="new.html" >新闻中心</a>
			<a href="">关于我们</a>
			<a href="">注册</a>
		</div>
		<form id="regform">
		<table id="table">
			<tr>
				<td>用 户 名</td>
				<td>
					<input id="username" type="text" placeholder="请输入用户名" style="height: 25px;"/>
					<span style="color: orange;" id="s_username">&nbsp;用户名为3-10位，字母、数字和下划线</span>
				</td>
			</tr>
			<tr>
				<td>密 码</td>	
				<td>	
					<input id="password" type="password" placeholder="请输入密码" style="height: 25px;"/>
					<span style="color: orange;" id="s_password">&nbsp;密码为6-9位，字母、数字和下划线</span>
				</td>
			</tr>
			<tr>
				<td>Email</td>
				<td>
					<input type="text" placeholder="请输入邮箱" style="height: 25px;"/>
				</td>
			</tr>
			<tr>
				<td>性别</td>
				<td>
					<input checked type="radio" name="gender"/>男
					<input type="radio" name="gender"/>女
					<input type="radio" name="gender"/>保密
				</td>
			</tr>
			<tr>
				<td>擅长的技术</td>
				<td>
					<input type="checkbox"/>HTML
					<input type="checkbox"/>CSS
					<input type="checkbox"/>JS
				</td>	
			</tr>
			<tr>
				<td>工作地点</td>
				<td>	
					<select style="height: 30px;">
						<option>太原</option>
						<option>吕梁</option>
						<option>临汾</option>
					</select>
				</td>
			</tr>
		</table>
		<input type="submit" value="注册" class="button"/>
		</form>
	</body>
	<script>
		document.getElementById("regform").onsubmit = function(){
			return checkUsername() && checkPassword();
		};
		
		document.getElementById("username").onblur = checkUsername;
		document.getElementById("password").onblur = checkPassword;
		
		// 用户名校验函数
		function checkUsername(){
			var username = document.getElementById("username").value.trim();
			var reg_username = /^\w{3,10}$/;
			var flag = reg_username.test(username);
			var s_username = document.getElementById("s_username");
					
			if(flag){
				s_username.style.color = "green";
				s_username.innerHTML = "✓ 输入正确";
			}else{
				s_username.style.color = "red";
				s_username.innerHTML = "✗ 用户名格式有误";
			}
			return flag;
		}
		
		// 密码校验函数
		function checkPassword(){
			var password = document.getElementById("password").value.trim();
			var reg_password = /^\w{6,9}$/;
			var flag = reg_password.test(password);
			var s_password = document.getElementById("s_password");
			
			if(flag){
				s_password.style.color = "green";
				s_password.innerHTML = "✓ 输入正确";
			}else{
				s_password.style.color = "red";
				s_password.innerHTML = "✗ 密码格式有误";
			}
			return flag;
		}
	</script>
</html>
